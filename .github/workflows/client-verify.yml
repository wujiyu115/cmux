name: Client Build Verify

# Manual only. Pushes to main and pull requests no longer trigger CI; run this
# from the Actions tab (or `gh workflow run client-verify.yml`) when you want the
# analyze + test sweep across platforms.
on:
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Also run the Linux integration suite (Claude PTY + Docker SSH)"
        type: boolean
        required: false
        default: false

concurrency:
  group: client-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client

jobs:
  verify:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            platform: linux
            install_linux_deps: true
            package_deb: true
          - os: windows-latest
            label: Windows
            platform: windows
            install_linux_deps: false
            package_deb: false
          - os: macos-latest
            label: macOS
            platform: macos
            install_linux_deps: false
            package_deb: false
          - os: ubuntu-22.04
            label: Android
            platform: android
            install_linux_deps: false
            package_deb: false
          - os: macos-latest
            label: iOS
            platform: ios
            install_linux_deps: false
            package_deb: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      # rust_lib_flutter_alacritty builds through cargokit during pod install.
      - name: Add Rust iOS target
        if: matrix.platform == 'ios'
        run: rustup target add aarch64-apple-ios

      - name: Install Linux build dependencies
        if: matrix.install_linux_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            libnotify-dev \
            dpkg fakeroot file

      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        if: matrix.platform == 'android'
        run: yes | flutter doctor --android-licenses

      - name: Activate fastforge
        if: matrix.package_deb
        run: dart pub global activate fastforge

      - name: Add pub-cache to PATH
        if: matrix.package_deb
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Sync bundled Google Fonts (Noto Sans SC)
        run: dart run tool/sync_bundled_google_fonts.dart

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit and widget tests
        run: flutter test --exclude-tags integration

      # No Apple signing certs in CI, so this only proves the iOS target compiles.
      - name: Generate native splash sources
        if: matrix.platform == 'ios'
        run: dart run native_splash_screen_cli gen

      - name: Build iOS (unsigned)
        if: matrix.platform == 'ios'
        run: flutter build ios --release --no-codesign

      # Analyze and the test suite cannot see a `pod install` failure, and the
      # iOS build cannot either — deployment targets are per-platform. Adding
      # speech_to_text (macOS 11.0) against a project targeting 10.15 broke this
      # build for an entire subproject while both gates stayed green. Debug
      # rather than release: it catches the same class of failure and matches
      # what AGENTS.md asks contributors to run locally.
      #
      # Windows and Linux have the same hole in this matrix; neither is added
      # here because neither has been confirmed green first.
      - name: Build macOS
        if: matrix.platform == 'macos'
        run: flutter build macos --debug

  integration-linux:
    name: Linux integration (Claude PTY + Docker SSH)
    if: inputs.run_integration
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libnotify-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Sync bundled Google Fonts (Noto Sans SC)
        run: dart run tool/sync_bundled_google_fonts.dart

      - name: Generate native splash sources
        run: dart run native_splash_screen_cli gen

      - name: Build Linux (PTY native lib)
        run: flutter build linux --debug

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build mixed Docker image (cached)
        uses: docker/build-push-action@v6
        with:
          context: client/test/integration/docker
          file: client/test/integration/docker/Dockerfile.mixed
          tags: teampilot-it-ssh-mixed:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mixed team Claude integration tests (L2 + L3)
        env:
          LD_LIBRARY_PATH: build/linux/x64/debug/bundle/lib
        run: flutter test --tags "integration && linux-pty" --concurrency=1
