name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch / tag / sha). Leave empty for current."
        required: false
        default: ""

defaults:
  run:
    working-directory: client

jobs:
  # No Apple signing certs are configured, so this produces an UNSIGNED IPA:
  # useful for sideloading (TrollStore / AltStore) and for proving the iOS target
  # builds. Add the signing secrets and switch to
  # `flutter build ipa --export-options-plist=…` when a certificate exists.
  build-ios:
    name: Build iOS (unsigned IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          submodules: recursive

      # rust_lib_flutter_alacritty builds through cargokit during pod install.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      # A mismatch here is not a warning: RustLib.init throws
      # "codegen version should be the same as runtime version" before runApp,
      # and on iOS that is a blank screen with no reachable log. It already
      # shipped once — the Dart constraint was `^2.12.0`, CI re-resolved to
      # 2.13.0 the day it was published, and the IPA was white on launch.
      - name: Assert flutter_rust_bridge codegen/runtime versions match
        run: |
          set -euo pipefail
          crate=packages/flutter_alacritty/packages/rust_lib_flutter_alacritty/rust/Cargo.toml
          rust=$(grep -oE 'flutter_rust_bridge = "=?[0-9]+\.[0-9]+\.[0-9]+"' "$crate" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          dart=$(grep -A7 '^  flutter_rust_bridge:' pubspec.lock | grep -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "rust crate pin: ${rust:-<none>} / resolved dart package: ${dart:-<none>}"
          if [ -z "$rust" ] || [ -z "$dart" ]; then
            echo "could not read both versions" >&2
            exit 1
          fi
          if [ "$rust" != "$dart" ]; then
            echo "flutter_rust_bridge mismatch: rust=$rust dart=$dart" >&2
            echo "Bump rust/Cargo.toml, regenerate bindings, and pin the Dart" >&2
            echo "dependency in client/pubspec.yaml to the same exact version." >&2
            exit 1
          fi

      - name: Sync bundled Google Fonts (Noto Sans SC)
        run: dart run tool/sync_bundled_google_fonts.dart

      - name: Generate native splash sources
        run: dart run native_splash_screen_cli gen

      # `flutter build ipa --no-codesign` stops at the .xcarchive (export needs a
      # signing identity), so we build the .app and wrap it in Payload/ ourselves.
      - name: Build iOS and wrap an unsigned IPA
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
          version=$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//')
          dist_dir="dist/${version}"
          mkdir -p "${dist_dir}/Payload"
          cp -R build/ios/iphoneos/Runner.app "${dist_dir}/Payload/"
          (cd "${dist_dir}" && zip -qry "teampilot-${version}-unsigned.ipa" Payload && rm -rf Payload)
          test -f "${dist_dir}/teampilot-${version}-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: client/dist/**/*.ipa
          if-no-files-found: error
